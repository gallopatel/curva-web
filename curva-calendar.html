<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curva — Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#00017F;--card-bg:rgba(255,255,255,0.09);--card-hover:rgba(255,255,255,0.14);
  --card-border:rgba(255,255,255,0.18);--yellow:#F5C518;--red:#C8001E;
  --text:#FFFFFF;--text-muted:rgba(255,255,255,0.68);--text-dim:rgba(255,255,255,0.38);
  --cat-match:#F5C518;--cat-music:#C084FC;--cat-special:#4ADE80;
  --cat-worldcup:#FF4060;--cat-private:#60C4FF;
}
html,body{background:var(--bg)}
body{font-family:'Outfit',sans-serif;color:var(--text);min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 4rem;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:repeating-linear-gradient(135deg,transparent,transparent 40px,
  rgba(255,255,255,0.018) 40px,rgba(255,255,255,0.018) 41px);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#010185 0% 33.3%,#F5C518 33.3% 66.6%,#C8001E 66.6% 100%);
  z-index:100}
.page{position:relative;z-index:1;width:100%;max-width:440px;
  padding:0 1.25rem;display:flex;flex-direction:column;align-items:center}

/* ── top bar ── */
.topbar{width:100%;display:flex;align-items:center;justify-content:center;
  padding:1.6rem 0 0}
.page-title{font-size:.72rem;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--yellow);opacity:.9}

/* ── hours block ── */
.hours-block{width:100%;margin:1.25rem 0 0;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;overflow:hidden}
.hours-header{display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1rem .6rem;border-bottom:1px solid rgba(255,255,255,0.1)}
.hours-title{font-size:.72rem;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--yellow);opacity:.9}
.hours-week{font-size:.68rem;font-weight:300;color:var(--text-dim)}
.hours-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.hours-row{display:flex;align-items:center;justify-content:space-between;
  padding:.42rem 1rem;border-bottom:1px solid rgba(255,255,255,0.06)}
.hours-row:last-child{border-bottom:none}
.hours-row.today-row{background:rgba(245,197,24,0.08)}
.hours-row.closed-row .hours-time{color:var(--text-dim);font-style:italic}
.hours-day{font-size:.75rem;font-weight:500;color:var(--text-muted)}
.hours-row.today-row .hours-day{color:var(--yellow);font-weight:600}
.hours-time{font-size:.75rem;font-weight:400;color:var(--text)}
.hours-loading{padding:1rem;text-align:center;font-size:.78rem;
  color:var(--text-dim);font-style:italic;animation:pulse 1.5s infinite}

/* ── legend ── */
.cal-legend{display:flex;flex-wrap:wrap;gap:.45rem .85rem;
  margin:1.3rem 0 .6rem;padding:0 2px;width:100%}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.62rem;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── calendar header ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;
  padding:.5rem 0 .9rem;width:100%}
.cal-month-title{font-size:1.05rem;font-weight:600;letter-spacing:.02em}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:34px;height:34px;border-radius:8px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);
  color:var(--text-muted);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:1.15rem;line-height:1;
  transition:background .15s,color .15s;font-family:'Outfit',sans-serif}
.cal-nav button:hover{background:rgba(255,255,255,0.16);color:#fff}

/* ── grid ── */
.cal-grid{width:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;
  margin-bottom:1.1rem}
.cal-dow{text-align:center;font-size:.6rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-dim);padding:3px 0 7px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:8px;font-size:.78rem;font-weight:400;
  color:var(--text-dim);position:relative;transition:background .15s;gap:2px}
.cal-day.other-month{opacity:.22}
.cal-day.today{background:rgba(255,255,255,0.10);color:#fff;font-weight:600;
  border:1px solid rgba(255,255,255,0.22)}
.cal-day.has-event{cursor:pointer;color:#fff;font-weight:500}
.cal-day.has-event:hover{background:rgba(255,255,255,0.11)}
.cal-day.selected{background:rgba(255,255,255,0.17)!important;
  color:#fff!important;border:1px solid rgba(255,255,255,0.38)}
.dot-row{display:flex;gap:2px;justify-content:center}
.evt-dot{width:4px;height:4px;border-radius:50%;display:block}

/* ── event cards ── */
.event-list{display:flex;flex-direction:column;gap:.5rem;width:100%;margin-bottom:.5rem}
.event-card{display:flex;gap:12px;align-items:flex-start;
  padding:13px 14px 13px 16px;
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:11px;position:relative;overflow:hidden;
  transition:background .18s,border-color .18s}
.event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ev-color,var(--yellow))}
.event-card:hover{background:var(--card-hover);border-color:var(--ev-color,var(--yellow))}
.ev-date-block{display:flex;flex-direction:column;align-items:center;min-width:34px}
.ev-day{font-size:1.35rem;font-weight:600;line-height:1;color:var(--ev-color,var(--yellow))}
.ev-mon{font-size:.58rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);margin-top:1px}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:.9rem;font-weight:500;margin-bottom:3px;color:#fff}
.ev-meta{font-size:.73rem;font-weight:300;color:var(--text-muted);line-height:1.5}
.ev-link{color:var(--ev-color,var(--yellow));font-size:.72rem;font-weight:500;
  text-decoration:none;display:inline-block;margin-top:5px}
.ev-link:hover{text-decoration:underline}
.ev-badge{font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;align-self:flex-start;white-space:nowrap;margin-top:1px}
.no-events{text-align:center;font-size:.82rem;font-weight:300;font-style:italic;
  color:var(--text-dim);padding:2.5rem 0;width:100%}
.cal-loading{text-align:center;font-size:.82rem;font-weight:300;color:var(--text-dim);
  padding:2rem 0;width:100%;animation:pulse 1.5s infinite}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <span class="page-title">Events</span>
  </div>

  <!-- HOURS BLOCK -->
  <div class="hours-block">
    <div class="hours-header">
      <span class="hours-title">This week's hours</span>
      <span class="hours-week" id="hours-week-range"></span>
    </div>
    <div id="hours-body">
      <div class="hours-loading">Loading hours…</div>
    </div>
  </div>

  <!-- LEGEND -->
  <div class="cal-legend">
    <span class="legend-item"><span class="legend-dot" style="background:var(--cat-match)"></span>Match day</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--cat-music)"></span>Music / DJ</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--cat-special)"></span>Special</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--cat-worldcup)"></span>World Cup / UCL</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--cat-private)"></span>Private event</span>
  </div>

  <div class="cal-header">
    <span class="cal-month-title" id="cal-title"></span>
    <div class="cal-nav">
      <button onclick="changeMonth(-1)" aria-label="Previous">&#8249;</button>
      <button onclick="changeMonth(1)"  aria-label="Next">&#8250;</button>
    </div>
  </div>

  <div class="cal-grid" id="cal-grid"></div>
  <div class="event-list" id="event-list"></div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  GOOGLE SHEETS CONNECTION
//
//  SHEET 1 — Events (tab named "Events")
//  Columns: Date | Title | Category | Time | Description | Link
//  Category values: match | music | special | worldcup | private
//  Date format: YYYY-MM-DD
//
//  SHEET 2 — Hours (tab named "Hours")
//  Columns: Day | Open | Close
//  Day values: Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday
//  Use "Closed" in the Open column for days you're not open.
//  Update this sheet each week to reflect current hours.
//
//  HOW TO GET THE CSV URLS:
//  File → Share → Publish to web → select the tab → CSV → Publish
//  You need TWO separate published CSV URLs, one per tab.
// ═══════════════════════════════════════════════════════════════

const EVENTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlnvGdph2Y_jYWCnQ-OZcH7TGwFuNvLJ76DjwJlxc9eSj5ySerbDV3ae1eQu3_xbJYnpYXUeNjpbS8/pub?gid=0&single=true&output=csv';

// Replace with your published Hours tab CSV URL:
const HOURS_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlnvGdph2Y_jYWCnQ-OZcH7TGwFuNvLJ76DjwJlxc9eSj5ySerbDV3ae1eQu3_xbJYnpYXUeNjpbS8/pub?gid=595431382&single=true&output=csv';

// ── Demo fallback hours (shown until sheet is connected) ───────
const DEMO_HOURS = [
  {day:'Monday',    open:'Closed', close:''},
  {day:'Tuesday',   open:'Closed', close:''},
  {day:'Wednesday', open:'12:00',  close:'22:00'},
  {day:'Thursday',  open:'12:00',  close:'22:00'},
  {day:'Friday',    open:'14:00',  close:'23:00'},
  {day:'Saturday',  open:'12:00',  close:'23:00'},
  {day:'Sunday',    open:'12:00',  close:'21:00'},
];

const DEMO_EVENTS = [
  {date:'2026-05-20',title:'Grand Opening Party',      category:'special',  time:'18:00',desc:'Doors open. Free entry. Live DJ.'},
  {date:'2026-05-23',title:"DJ Set — Dino d'Santiago", category:'music',    time:'21:00',desc:'Afro-jazz & kuduro vibes.'},
  {date:'2026-05-30',title:'UCL Final Watch Party',    category:'worldcup', time:'17:00',desc:'Champions League Final — Budapest.'},
  {date:'2026-06-06',title:'DJ Set — Branko',          category:'music',    time:'21:00',desc:'Electronic & Afrobeat.'},
  {date:'2026-06-11',title:'World Cup Fan Zone Opens', category:'worldcup', time:'20:00',desc:'Opening day. All screens live.'},
  {date:'2026-06-14',title:'Portugal Watch Party',     category:'match',    time:'19:00',desc:'Portugal group stage. Fan zone open.'},
  {date:'2026-06-19',title:'DJ Set — Surma',           category:'music',    time:'21:00',desc:'Electronic & fado fusion.'},
  {date:'2026-06-22',title:'Portugal Watch Party',     category:'match',    time:'19:00',desc:'Portugal group stage. Full fan zone.'},
  {date:'2026-06-26',title:'DJ Set — Xinobi',          category:'music',    time:'21:00',desc:'Deep house. Lisbon selects.'},
  {date:'2026-07-02',title:'Round of 32 Watch Party',  category:'worldcup', time:'18:00',desc:'Best match of the day. Big screen.'},
  {date:'2026-07-10',title:'DJ Set — ProfJam',         category:'music',    time:'21:00',desc:'Hip-hop & trap from Lisbon.'},
  {date:'2026-07-14',title:'Quarter-Final Watch Party',category:'worldcup', time:'18:00',desc:'Full evening. Fan zone. DJ warm-up.'},
  {date:'2026-07-19',title:'World Cup Final',          category:'worldcup', time:'16:00',desc:'The big one. Doors 16:00. Party all night.'},
];

const CAT = {
  match:    {color:'#F5C518',label:'Match Day',        bg:'rgba(245,197,24,0.16)',  tc:'#F5C518'},
  music:    {color:'#C084FC',label:'Music / DJ',       bg:'rgba(192,132,252,0.16)', tc:'#C084FC'},
  special:  {color:'#4ADE80',label:'Special Event',    bg:'rgba(74,222,128,0.16)',  tc:'#4ADE80'},
  worldcup: {color:'#FF4060',label:'World Cup / UCL',  bg:'rgba(255,64,96,0.16)',   tc:'#FF4060'},
  private:  {color:'#60C4FF',label:'Private Event',    bg:'rgba(96,196,255,0.16)',  tc:'#60C4FF'},
};

const MONTHS   = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
const DAYS     = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const DAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let allEvents  = [];
let viewYear   = new Date().getFullYear();
let viewMonth  = new Date().getMonth();
let selectedDate = null;

// ── CSV parser ─────────────────────────────────────────────────
function parseCSV(csv) {
  const lines = csv.trim().split('\n').slice(1);
  return lines.map(line => {
    const cols=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){inQ=!inQ;continue}
      if(line[i]===','&&!inQ){cols.push(cur.trim());cur='';}
      else cur+=line[i];
    }
    cols.push(cur.trim());
    return cols;
  }).filter(r=>r.length&&r[0]);
}

// ── Week range label ───────────────────────────────────────────
function weekRangeLabel() {
  const now   = new Date();
  const dow   = now.getDay(); // 0=Sun
  const mon   = new Date(now); mon.setDate(now.getDate() - ((dow+6)%7));
  const sun   = new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt   = d => `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
  return `${fmt(mon)} – ${fmt(sun)}`;
}

// ── Render hours ───────────────────────────────────────────────
function renderHours(rows) {
  const todayName = DAY_FULL[new Date().getDay()];
  document.getElementById('hours-week-range').textContent = weekRangeLabel();

  // Build lookup from parsed rows
  const lookup = {};
  rows.forEach(r => { if(r[0]) lookup[r[0].trim()] = {open:r[1]||'',close:r[2]||''}; });

  const order = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  let html = '';
  order.forEach(day => {
    const h       = lookup[day] || {open:'Closed',close:''};
    const closed  = h.open.toLowerCase()==='closed'||!h.open;
    const isToday = day===todayName;
    const time    = closed ? 'Closed' : `${h.open}${h.close?' – '+h.close:''}`;
    html += `<div class="hours-row${isToday?' today-row':''}${closed?' closed-row':''}">
      <span class="hours-day">${day}</span>
      <span class="hours-time">${time}</span>
    </div>`;
  });
  document.getElementById('hours-body').innerHTML = html;
}

// ── Load hours from sheet ──────────────────────────────────────
async function loadHours() {
  if(!HOURS_CSV_URL||HOURS_CSV_URL==='YOUR_HOURS_TAB_CSV_URL_HERE'){
    renderHours(DEMO_HOURS.map(h=>[h.day,h.open,h.close]));
    return;
  }
  try {
    const res  = await fetch(HOURS_CSV_URL);
    const rows = parseCSV(await res.text());
    renderHours(rows);
  } catch(e) {
    renderHours(DEMO_HOURS.map(h=>[h.day,h.open,h.close]));
  }
}

// ── Load events from sheet ─────────────────────────────────────
async function loadEvents() {
  if(!EVENTS_CSV_URL||EVENTS_CSV_URL==='YOUR_EVENTS_TAB_CSV_URL_HERE'){
    allEvents=DEMO_EVENTS; renderCalendar(); return;
  }
  document.getElementById('event-list').innerHTML='<p class="cal-loading">Loading events…</p>';
  try {
    const res  = await fetch(EVENTS_CSV_URL);
    const rows = parseCSV(await res.text());
    allEvents  = rows.map(r=>({
      date:r[0]||'', title:r[1]||'',
      category:(r[2]||'special').toLowerCase(),
      time:r[3]||'', desc:r[4]||'', link:r[5]||''
    })).filter(e=>e.date&&e.title);
  } catch(e) { allEvents=DEMO_EVENTS; }
  renderCalendar();
}

// ── Calendar render ────────────────────────────────────────────
function eventsOnDay(y,m,d){
  const s=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return allEvents.filter(e=>e.date===s);
}

function renderCalendar(){
  document.getElementById('cal-title').textContent=MONTHS[viewMonth]+' '+viewYear;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  DAYS.forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});

  const today=new Date();
  const firstDow=new Date(viewYear,viewMonth,1).getDay();
  const dim=new Date(viewYear,viewMonth+1,0).getDate();
  const prevDim=new Date(viewYear,viewMonth,0).getDate();

  for(let i=0;i<firstDow;i++){
    const el=document.createElement('div');el.className='cal-day other-month';
    el.textContent=prevDim-firstDow+1+i;grid.appendChild(el);
  }
  for(let d=1;d<=dim;d++){
    const el=document.createElement('div');el.className='cal-day';
    const numSpan=document.createElement('span');numSpan.textContent=d;el.appendChild(numSpan);
    const isToday=(today.getFullYear()===viewYear&&today.getMonth()===viewMonth&&today.getDate()===d);
    if(isToday)el.classList.add('today');
    const evs=eventsOnDay(viewYear,viewMonth,d);
    if(evs.length){
      el.classList.add('has-event');
      const dr=document.createElement('div');dr.className='dot-row';
      evs.slice(0,3).forEach(ev=>{
        const dot=document.createElement('span');dot.className='evt-dot';
        dot.style.background=(CAT[ev.category]||CAT.special).color;
        dr.appendChild(dot);
      });
      el.appendChild(dr);
      el.onclick=()=>selectDay(d);
    }
    const ds=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(selectedDate===ds)el.classList.add('selected');
    grid.appendChild(el);
  }
  const total=firstDow+dim;
  const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++){
    const el=document.createElement('div');el.className='cal-day other-month';el.textContent=i;grid.appendChild(el);
  }
  renderEventList();
}

function selectDay(d){
  const ds=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  selectedDate=(selectedDate===ds)?null:ds;
  renderCalendar();
}

function renderEventList(){
  const list=document.getElementById('event-list');list.innerHTML='';
  const shown=(selectedDate
    ?allEvents.filter(e=>e.date===selectedDate)
    :allEvents.filter(e=>{const[y,m]=e.date.split('-').map(Number);return y===viewYear&&m===viewMonth+1;}))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!shown.length){
    const p=document.createElement('p');p.className='no-events';
    p.textContent=selectedDate?'No events on this day.':'No events this month.';
    list.appendChild(p);return;
  }
  shown.forEach(ev=>{
    const cat=CAT[ev.category]||CAT.special;
    const[,mm,dd]=ev.date.split('-');
    const mon=MONTHS[parseInt(mm)-1].slice(0,3).toUpperCase();
    const card=document.createElement('div');
    card.className='event-card';card.style.setProperty('--ev-color',cat.color);
    card.innerHTML=`
      <div class="ev-date-block">
        <span class="ev-day">${parseInt(dd)}</span>
        <span class="ev-mon">${mon}</span>
      </div>
      <div class="ev-body">
        <div class="ev-title">${ev.title}</div>
        <div class="ev-meta">${ev.time?ev.time+(ev.desc?' &middot; ':''):''}${ev.desc}</div>
        ${ev.link?`<a class="ev-link" href="${ev.link}" target="_blank" rel="noopener">More info &#8250;</a>`:''}
      </div>
      <span class="ev-badge" style="background:${cat.bg};color:${cat.tc}">${cat.label}</span>`;
    list.appendChild(card);
  });
}

function changeMonth(dir){
  viewMonth+=dir;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  if(viewMonth<0){viewMonth=11;viewYear--;}
  selectedDate=null;renderCalendar();
}

// kick off both loads in parallel
loadHours();
loadEvents();
</script>
</body>
</html>
