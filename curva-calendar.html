<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curva — Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#00017F;--yellow:#F5C518;--red:#C8001E;
  --cat-match:#F5C518;--cat-music:#C084FC;--cat-special:#4ADE80;
  --cat-worldcup:#FF4060;--cat-private:#60C4FF;
}
html,body{height:100%;background:var(--navy)}
body{font-family:'Outfit',sans-serif;display:flex;flex-direction:column;
  min-height:100vh;overflow-x:hidden}

.hours-bar{background:#fff;border-bottom:1px solid #E0E4F4;
  padding:10px 28px;display:flex;align-items:center;gap:20px;flex-shrink:0}
.hb-label{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--navy);opacity:.4;white-space:nowrap;flex-shrink:0}
.hb-week{font-size:10px;font-weight:300;color:#A0A8C0;white-space:nowrap;flex-shrink:0;margin-right:4px}
.hb-cells{display:flex;flex:1;gap:0}
.hb-cell{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:2px 4px;border-right:1px solid #F0F2FA}
.hb-cell:last-child{border-right:none}
.hb-cell.today{background:#FFFBE8;border-radius:5px}
.hb-day{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#B0B8D0}
.hb-cell.today .hb-day{color:#9B7200}
.hb-time{font-size:11px;font-weight:600;color:var(--navy);white-space:nowrap}
.hb-cell.today .hb-time{color:#9B7200}
.hb-time.cl{color:#C8D0E0;font-style:italic;font-weight:300;font-size:10px}
.hb-loading{font-size:11px;color:#A0A8C0;font-style:italic}

.layout{display:grid;grid-template-columns:1fr 260px;flex:1}

.main{background:var(--navy);padding:28px 30px 36px;
  display:flex;flex-direction:column;gap:18px;position:relative;overflow-y:auto}
.main::before{content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(135deg,transparent,transparent 40px,
  rgba(255,255,255,0.015) 40px,rgba(255,255,255,0.015) 41px);
  pointer-events:none;z-index:0}
.main>*{position:relative;z-index:1}

.cal-top{display:flex;align-items:center;justify-content:space-between}
.cal-month-title{font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:.02em}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:8px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);
  color:rgba(255,255,255,0.7);cursor:pointer;font-size:1.2rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;font-family:'Outfit',sans-serif}
.cal-nav button:hover{background:rgba(255,255,255,0.16);color:#fff}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,0.28);padding:0 0 7px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:7px;font-size:12px;font-weight:400;
  color:rgba(255,255,255,0.2);gap:2px;transition:background .15s}
.cal-day.cur-month{color:rgba(255,255,255,0.6)}
.cal-day.has-event{color:#fff;font-weight:600;background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.13);cursor:pointer}
.cal-day.has-event:hover{background:rgba(255,255,255,0.13)}
.cal-day.today{background:#fff;color:var(--navy);font-weight:700;border:none}
.cal-day.selected{background:rgba(245,197,24,0.2);
  border:1.5px solid rgba(245,197,24,0.6);color:var(--yellow);font-weight:700}
.dot-row{display:flex;gap:2px;justify-content:center}
.evt-dot{width:4px;height:4px;border-radius:50%;display:block}

.sidebar{background:#fff;border-left:1px solid #E0E4F4;
  padding:24px 18px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.s-title{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--navy);opacity:.4;margin-bottom:10px}
.leg-list{display:flex;flex-direction:column;gap:9px}
.leg-i{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:400;color:#5060A0}
.leg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.sb-list{display:flex;flex-direction:column;gap:7px}
.sb-card{display:flex;gap:10px;align-items:flex-start;
  padding:10px 11px 10px 13px;background:#F7F8FD;border:1px solid #E8EAF4;
  border-radius:9px;position:relative;overflow:hidden;
  transition:background .18s,border-color .18s}
.sb-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ec,var(--yellow))}
.sb-card:hover{background:#EEEFFE;border-color:var(--ec,var(--yellow))}
.sb-date{display:flex;flex-direction:column;align-items:center;min-width:26px}
.sb-day{font-size:1.05rem;font-weight:700;line-height:1;color:var(--ec,var(--navy))}
.sb-mon{font-size:.52rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:#A0A8C0;margin-top:1px}
.sb-body{flex:1;min-width:0}
.sb-name{font-size:.8rem;font-weight:600;color:var(--navy);margin-bottom:1px}
.sb-meta{font-size:.68rem;font-weight:300;color:#8090B8;line-height:1.4}
.sb-badge{font-size:.52rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:20px;align-self:flex-start;white-space:nowrap;margin-top:1px}
.sb-none{font-size:.78rem;font-weight:300;font-style:italic;
  color:#A0A8C0;padding:1rem 0;text-align:center}
.ev-link{font-size:.68rem;font-weight:500;color:var(--ec,var(--navy));
  text-decoration:none;display:inline-block;margin-top:3px}
.ev-link:hover{text-decoration:underline}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{border-left:none;border-top:1px solid #E0E4F4}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>

<div class="hours-bar">
  <span class="hb-label">This week's hours</span>
  <span class="hb-week" id="hours-week-range"></span>
  <div class="hb-cells" id="hours-body"><span class="hb-loading">Loading…</span></div>
</div>

<div class="layout">
  <main class="main">
    <div class="cal-top">
      <span class="cal-month-title" id="cal-title"></span>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">&#8249;</button>
        <button onclick="changeMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </main>

  <aside class="sidebar">
    <div>
      <div class="s-title" id="s-cat-title">Categories</div>
      <div class="leg-list">
        <div class="leg-i"><span class="leg-d" style="background:var(--cat-match)"></span><span>Match day</span></div>
        <div class="leg-i"><span class="leg-d" style="background:var(--cat-music)"></span><span>Music / DJ</span></div>
        <div class="leg-i"><span class="leg-d" style="background:var(--cat-special)"></span><span>Special event</span></div>
        <div class="leg-i"><span class="leg-d" style="background:var(--cat-worldcup)"></span><span>World Cup / UCL</span></div>
        <div class="leg-i"><span class="leg-d" style="background:var(--cat-private)"></span><span>Private event</span></div>
      </div>
    </div>
    <div style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="s-title" id="sb-title">This month's events</div>
      <div class="sb-list" id="sb-list"></div>
    </div>
  </aside>
</div>

<script>
// Language detection
var LANG = (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en';

var I18N = {
  en: {
    hoursLabel: "This week's hours",
    categories: 'Categories',
    thisMonth: "This month's events",
    noEvents: 'No events this month.',
    noEventsDay: 'No events on this day.',
    moreInfo: 'More info',
    loading: 'Loading...',
    loadingEvents: 'Loading events...',
    match: 'Match Day', music: 'Music / DJ', special: 'Special Event',
    worldcup: 'World Cup / UCL', private: 'Private Event',
    months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    days: ['Su','Mo','Tu','We','Th','Fr','Sa'],
    dayAbbr: {Monday:'Mon',Tuesday:'Tue',Wednesday:'Wed',Thursday:'Thu',Friday:'Fri',Saturday:'Sat',Sunday:'Sun'}
  },
  pt: {
    hoursLabel: 'Horário desta semana',
    categories: 'Categorias',
    thisMonth: 'Eventos deste mês',
    noEvents: 'Sem eventos este mês.',
    noEventsDay: 'Sem eventos neste dia.',
    moreInfo: 'Mais info',
    loading: 'A carregar...',
    loadingEvents: 'A carregar eventos...',
    match: 'Jogo', music: 'Música / DJ', special: 'Evento Especial',
    worldcup: 'Mundial / UCL', private: 'Evento Privado',
    months: ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],
    days: ['Do','Se','Te','Qu','Qu','Se','Sá'],
    dayAbbr: {Monday:'Seg',Tuesday:'Ter',Wednesday:'Qua',Thursday:'Qui',Friday:'Sex',Saturday:'Sáb',Sunday:'Dom'}
  }
};

var T = I18N[LANG];

// Sheet URLs
var EVENTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlnvGdph2Y_jYWCnQ-OZcH7TGwFuNvLJ76DjwJlxc9eSj5ySerbDV3ae1eQu3_xbJYnpYXUeNjpbS8/pub?gid=0&single=true&output=csv';
var HOURS_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlnvGdph2Y_jYWCnQ-OZcH7TGwFuNvLJ76DjwJlxc9eSj5ySerbDV3ae1eQu3_xbJYnpYXUeNjpbS8/pub?gid=595431382&single=true&output=csv';

var DEMO_HOURS = [
  {day:'Monday',open:'Closed',close:''},{day:'Tuesday',open:'Closed',close:''},
  {day:'Wednesday',open:'12:00',close:'22:00'},{day:'Thursday',open:'12:00',close:'22:00'},
  {day:'Friday',open:'14:00',close:'23:00'},{day:'Saturday',open:'12:00',close:'23:00'},
  {day:'Sunday',open:'12:00',close:'21:00'}
];

var DEMO_EVENTS = [
  {date:'2026-05-20',title:'Grand Opening Party',category:'special',time:'18:00',desc:'Doors open. Free entry. Live DJ.',link:''},
  {date:'2026-05-23',title:"DJ Set — Dino d'Santiago",category:'music',time:'21:00',desc:'Afro-jazz & kuduro vibes.',link:''},
  {date:'2026-05-30',title:'UCL Final Watch Party',category:'worldcup',time:'17:00',desc:'Champions League Final — Budapest.',link:''},
  {date:'2026-06-06',title:'DJ Set — Branko',category:'music',time:'21:00',desc:'Electronic & Afrobeat.',link:''},
  {date:'2026-06-11',title:'World Cup Fan Zone Opens',category:'worldcup',time:'20:00',desc:'Opening day. All screens live.',link:''},
  {date:'2026-06-14',title:'Portugal Watch Party',category:'match',time:'19:00',desc:'Portugal group stage. Fan zone open.',link:''},
  {date:'2026-06-19',title:'DJ Set — Surma',category:'music',time:'21:00',desc:'Electronic & fado fusion.',link:''},
  {date:'2026-06-22',title:'Portugal Watch Party',category:'match',time:'19:00',desc:'Portugal group stage. Full fan zone.',link:''},
  {date:'2026-06-26',title:'DJ Set — Xinobi',category:'music',time:'21:00',desc:'Deep house. Lisbon selects.',link:''},
  {date:'2026-07-02',title:'Round of 32 Watch Party',category:'worldcup',time:'18:00',desc:'Best match of the day. Big screen.',link:''},
  {date:'2026-07-10',title:'DJ Set — ProfJam',category:'music',time:'21:00',desc:'Hip-hop & trap from Lisbon.',link:''},
  {date:'2026-07-14',title:'Quarter-Final Watch Party',category:'worldcup',time:'18:00',desc:'Full evening. Fan zone. DJ warm-up.',link:''},
  {date:'2026-07-19',title:'World Cup Final',category:'worldcup',time:'16:00',desc:'The big one. Doors 16:00. Party all night.',link:''}
];

var CAT = {
  match:    {color:'#F5C518', label:T.match,    bg:'rgba(245,197,24,0.16)',   tc:'#F5C518'},
  music:    {color:'#C084FC', label:T.music,    bg:'rgba(192,132,252,0.16)',  tc:'#C084FC'},
  special:  {color:'#4ADE80', label:T.special,  bg:'rgba(74,222,128,0.16)',   tc:'#4ADE80'},
  worldcup: {color:'#FF4060', label:T.worldcup, bg:'rgba(255,64,96,0.16)',    tc:'#FF4060'},
  private:  {color:'#60C4FF', label:T.private,  bg:'rgba(96,196,255,0.16)',   tc:'#60C4FF'}
};

var MONTHS   = T.months.slice();
var DAYS     = T.days.slice();
var DAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAY_ABBR = Object.assign({}, T.dayAbbr);

var allEvents = [];
var viewYear  = new Date().getFullYear();
var viewMonth = new Date().getMonth();
var selectedDate = null;

function parseCSV(csv) {
  var lines = csv.trim().split('\n').slice(1);
  return lines.map(function(line) {
    var cols = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; continue; }
      if (line[i] === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += line[i];
    }
    cols.push(cur.trim());
    return cols;
  }).filter(function(r) { return r.length && r[0]; });
}

function weekRangeLabel() {
  var now = new Date(), dow = now.getDay();
  var mon = new Date(now); mon.setDate(now.getDate() - ((dow + 6) % 7));
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  function fmt(d) { return MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate(); }
  return fmt(mon) + ' – ' + fmt(sun);
}

function renderHours(rows) {
  var todayName = DAY_FULL[new Date().getDay()];
  document.getElementById('hours-week-range').textContent = weekRangeLabel();
  var lookup = {};
  rows.forEach(function(r) { if (r[0]) lookup[r[0].trim()] = {open: r[1]||'', close: r[2]||''}; });
  var order = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var html = '';
  order.forEach(function(day) {
    var h = lookup[day] || {open:'Closed', close:''};
    var closed = h.open.toLowerCase() === 'closed' || !h.open;
    var isToday = day === todayName;
    var time = closed ? 'Closed' : h.open + (h.close ? ' – ' + h.close : '');
    html += '<div class="hb-cell' + (isToday ? ' today' : '') + '">' +
      '<span class="hb-day">' + DAY_ABBR[day] + '</span>' +
      '<span class="hb-time' + (closed ? ' cl' : '') + '">' + time + '</span>' +
      '</div>';
  });
  document.getElementById('hours-body').innerHTML = html;
}

function loadHours() {
  if (!HOURS_CSV_URL || HOURS_CSV_URL === 'YOUR_HOURS_TAB_CSV_URL_HERE') {
    renderHours(DEMO_HOURS.map(function(h) { return [h.day, h.open, h.close]; }));
    return;
  }
  fetch(HOURS_CSV_URL)
    .then(function(r) { return r.text(); })
    .then(function(txt) { renderHours(parseCSV(txt)); })
    .catch(function() { renderHours(DEMO_HOURS.map(function(h) { return [h.day, h.open, h.close]; })); });
}

function loadEvents() {
  if (!EVENTS_CSV_URL || EVENTS_CSV_URL === 'YOUR_EVENTS_TAB_CSV_URL_HERE') {
    allEvents = DEMO_EVENTS; renderAll(); return;
  }
  fetch(EVENTS_CSV_URL)
    .then(function(r) { return r.text(); })
    .then(function(txt) {
      var rows = parseCSV(txt);
      allEvents = rows.map(function(r) {
        return {date:r[0]||'', title:r[1]||'', category:(r[2]||'special').toLowerCase(),
                time:r[3]||'', desc:r[4]||'', link:r[5]||''};
      }).filter(function(e) { return e.date && e.title; });
      renderAll();
    })
    .catch(function() { allEvents = DEMO_EVENTS; renderAll(); });
}

function renderAll() { renderCalendar(); renderSidebar(); }

function eventsOnDay(y, m, d) {
  var s = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  return allEvents.filter(function(e) { return e.date === s; });
}

function renderCalendar() {
  document.getElementById('cal-title').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  var grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  DAYS.forEach(function(d) {
    var el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el);
  });
  var today = new Date();
  var firstDow = new Date(viewYear, viewMonth, 1).getDay();
  var dim = new Date(viewYear, viewMonth+1, 0).getDate();
  var prevDim = new Date(viewYear, viewMonth, 0).getDate();
  for (var i = 0; i < firstDow; i++) {
    var el = document.createElement('div'); el.className = 'cal-day';
    el.textContent = prevDim - firstDow + 1 + i; grid.appendChild(el);
  }
  for (var d = 1; d <= dim; d++) {
    var el = document.createElement('div'); el.className = 'cal-day cur-month';
    var ns = document.createElement('span'); ns.textContent = d; el.appendChild(ns);
    if (today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d)
      el.classList.add('today');
    var evs = eventsOnDay(viewYear, viewMonth, d);
    if (evs.length) {
      el.classList.add('has-event');
      var dr = document.createElement('div'); dr.className = 'dot-row';
      evs.slice(0,3).forEach(function(ev) {
        var dot = document.createElement('span'); dot.className = 'evt-dot';
        dot.style.background = (CAT[ev.category] || CAT.special).color;
        dr.appendChild(dot);
      });
      el.appendChild(dr);
      (function(day) { el.onclick = function() { selectDay(day); }; })(d);
    }
    var ds = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    if (selectedDate === ds) el.classList.add('selected');
    grid.appendChild(el);
  }
  var total = firstDow + dim, rem = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (var i = 1; i <= rem; i++) {
    var el = document.createElement('div'); el.className = 'cal-day'; el.textContent = i; grid.appendChild(el);
  }
}

function getShown() {
  var list = selectedDate
    ? allEvents.filter(function(e) { return e.date === selectedDate; })
    : allEvents.filter(function(e) {
        var parts = e.date.split('-').map(Number);
        return parts[0] === viewYear && parts[1] === viewMonth + 1;
      });
  return list.sort(function(a,b) { return a.date.localeCompare(b.date); });
}

function monthLabel() {
  if (selectedDate) {
    return parseInt(selectedDate.split('-')[2]) + ' ' + MONTHS[viewMonth].slice(0,3) + ' events';
  }
  return T.thisMonth;
}

function renderSidebar() {
  var sb = document.getElementById('sb-list');
  sb.innerHTML = '';
  document.getElementById('sb-title').textContent = monthLabel();
  var shown = getShown();
  if (!shown.length) {
    var p = document.createElement('p'); p.className = 'sb-none';
    p.textContent = selectedDate ? T.noEventsDay : T.noEvents;
    sb.appendChild(p); return;
  }
  shown.forEach(function(ev) {
    var cat = CAT[ev.category] || CAT.special;
    var parts = ev.date.split('-');
    var mon = MONTHS[parseInt(parts[1])-1].slice(0,3).toUpperCase();
    var dd  = parseInt(parts[2]);
    var card = document.createElement('div');
    card.className = 'sb-card';
    card.style.setProperty('--ec', cat.color);
    var linkHtml = ev.link
      ? '<a class="ev-link" href="' + ev.link + '" target="_blank" rel="noopener">' + T.moreInfo + ' ›</a>'
      : '';
    var metaStr = (ev.time ? ev.time + (ev.desc ? ' · ' : '') : '') + ev.desc;
    card.innerHTML =
      '<div class="sb-date">' +
        '<span class="sb-day">' + dd + '</span>' +
        '<span class="sb-mon">' + mon + '</span>' +
      '</div>' +
      '<div class="sb-body">' +
        '<div class="sb-name">' + ev.title + '</div>' +
        '<div class="sb-meta">' + metaStr + '</div>' +
        linkHtml +
      '</div>' +
      '<span class="sb-badge" style="background:' + cat.bg + ';color:' + cat.tc + '">' + cat.label + '</span>';
    sb.appendChild(card);
  });
}

function selectDay(d) {
  var ds = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  selectedDate = (selectedDate === ds) ? null : ds;
  renderAll();
}

function changeMonth(dir) {
  viewMonth += dir;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
  selectedDate = null;
  renderAll();
}

// Apply i18n to static HTML elements
document.documentElement.lang = LANG;
document.querySelector('.hb-label').textContent = T.hoursLabel;
document.getElementById('s-cat-title').textContent = T.categories;
var catLabels = [T.match, T.music, T.special, T.worldcup, T.private];
document.querySelectorAll('.leg-i span:last-child').forEach(function(el, i) {
  el.textContent = catLabels[i];
});

// Kick off data loads
loadHours();
loadEvents();
</script>
</body>
</html>
